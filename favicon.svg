<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Logo PixelMur: una "P" hecha de píxeles con el degradado de la web -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0b0f1a"/>
  <!-- La P: cada cuadrado es un "píxel" de 4x4 -->
  <g fill="url(#g)" shape-rendering="crispEdges">
    <rect x="8"  y="6"  width="12" height="4"/>
    <rect x="8"  y="10" width="4"  height="16"/>
    <rect x="20" y="10" width="4"  height="4"/>
    <rect x="12" y="14" width="8"  height="4"/>
  </g>
  <!-- Píxel suelto en cian, como el ".web" del logo -->
  <rect x="20" y="22" width="4" height="4" fill="#22d3ee" shape-rendering="crispEdges"/>
</svg>
